<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI for Finance &mdash; LexAi</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', sans-serif; background: #f4f6f8; color: #0b0d19; line-height: 1.75; }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    height: 84px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 2.5rem;
    background: rgba(11,13,25,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .logo { font-size: 1.9rem; font-weight: 700; color: #fff; text-decoration: none; }
  .logo span { color: #00c2b5; }
  .nav-right { display: flex; align-items: center; gap: 2.5rem; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 1rem; font-weight: 300; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: #00c2b5; }
  .nav-links .dropdown { position: relative; }
  .nav-links .dropdown-menu {
    display: none; position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%);
    background: #0f1223; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: 0.5rem 0; min-width: 160px; z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .nav-links .dropdown-menu a { display: block; padding: 0.55rem 1.2rem; font-size: 0.9rem; white-space: nowrap; }
  .nav-links .dropdown:hover .dropdown-menu { display: block; }
  .nav-links .dropdown-toggle { display: flex; align-items: center; gap: 5px; cursor: default; }
  .nav-links .dropdown-toggle svg { transition: transform 0.2s; }
  .nav-links .dropdown:hover .dropdown-toggle svg { transform: rotate(180deg); }
  .nav-cta { background: #00c2b5; color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 0.88rem; padding: 0.6rem 1.4rem; border-radius: 25px; border: none; cursor: pointer; text-decoration: none; transition: opacity 0.2s; }
  .nav-cta:hover { opacity: 0.85; }

  /* HERO */
  .hero {
    background-color: #080b16;
    background-image:
      radial-gradient(ellipse 100% 80% at 10% 40%, rgba(0,194,181,1)  0%, transparent 65%),
      radial-gradient(ellipse  80% 70% at 90% 65%, rgba(0,180,194,.9) 0%, transparent 65%),
      radial-gradient(ellipse  60% 50% at 55%  0%, rgba(0,194,181,.7) 0%, transparent 60%);
    background-size: 200% 200%;
    background-position: 100% 50%, 0% 50%, 60% 90%;
    padding: 6rem 2rem 5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero-bg { display: none; }
  .hero::before { content: none; }
  .hero > *:not(.hero-bg) { position: relative; z-index: 2; }
  .hero-eyebrow {
    display: inline-block; background: rgba(0,194,181,0.12); color: #00c2b5;
    font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 3px;
    padding: 6px 20px; border-radius: 20px; border: 1px solid rgba(0,194,181,0.25);
    margin-bottom: 1.6rem;
  }
  .hero h1 {
    font-size: clamp(2.2rem, 5.5vw, 3.6rem); font-weight: 700; color: #f0f0f0;
    line-height: 1.15; margin-bottom: 1.4rem; max-width: 820px; margin-left: auto; margin-right: auto;
  }
  .hero h1 em { color: #00c2b5; font-style: normal; }
  .hero-sub {
    font-size: 1.05rem; font-weight: 300; color: rgba(255,255,255,0.85); max-width: 580px;
    margin: 0 auto 2.5rem; line-height: 1.75; letter-spacing: 0;
  }
  .hero-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    background: #00c2b5; color: #fff; font-family: 'Poppins', sans-serif;
    font-weight: 700; font-size: 0.95rem; padding: 0.85rem 2rem;
    border-radius: 30px; text-decoration: none; transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-ghost {
    background: transparent; color: rgba(255,255,255,0.75); font-family: 'Poppins', sans-serif;
    font-weight: 600; font-size: 0.95rem; padding: 0.85rem 2rem;
    border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-ghost:hover { border-color: #00c2b5; color: #00c2b5; }

  /* TRUST BAR */
  .trust-bar {
    background: #0f1223;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 1.4rem 2rem;
    display: flex; align-items: center; justify-content: center; gap: 2.5rem;
    flex-wrap: wrap;
  }
  .trust-item { display: flex; align-items: center; gap: 0.55rem; color: rgba(255,255,255,0.85); font-size: 0.82rem; font-weight: 300; }
  .trust-item svg { color: #00c2b5; flex-shrink: 0; }

  /* SECTION COMMONS */
  .section { padding: 5rem 2rem; }
  .section.alt { background: #fff; }
  .container { max-width: 1080px; margin: 0 auto; }
  .section-label {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px;
    color: #00c2b5; margin-bottom: 0.8rem;
  }
  .section-title { font-size: clamp(1.7rem, 3.5vw, 2.5rem); font-weight: 700; color: #0b0d19; line-height: 1.2; margin-bottom: 1rem; }
  .section-title em { color: #00c2b5; font-style: normal; }
  .section-body { font-size: 1rem; color: #555; max-width: 620px; line-height: 1.85; }

  /* POSITIONING CALLOUT */
  .callout-strip {
    background: #0b0d19;
    border-radius: 18px;
    padding: 3.5rem 3rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: center;
    margin: 3rem 0;
  }
  @media (max-width: 700px) { .callout-strip { grid-template-columns: 1fr; } }
  .callout-strip .left-text h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 1rem; }
  .callout-strip .left-text h2 em { color: #00c2b5; font-style: normal; }
  .callout-strip .left-text p { color: rgba(255,255,255,0.6); font-size: 0.97rem; line-height: 1.8; }
  .callout-right { display: flex; flex-direction: column; gap: 1.2rem; }
  .compare-item { display: flex; gap: 1rem; align-items: flex-start; }
  .compare-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(0,194,181,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .compare-icon svg { color: #00c2b5; }
  .compare-text strong { display: block; color: #fff; font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; }
  .compare-text span { color: rgba(255,255,255,0.5); font-size: 0.87rem; line-height: 1.6; }

  /* SECTION IMAGE */
  .section-img {
    width: 100%; border-radius: 16px; overflow: hidden;
    margin-top: 3rem; aspect-ratio: 16/7;
    position: relative;
  }
  .section-img img {
    width: 100%; height: 100%; object-fit: cover; object-position: center;
    display: block;
  }
  .section-img-caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 1.5rem 2rem;
    background: linear-gradient(to top, rgba(11,13,25,0.75) 0%, transparent 100%);
    color: rgba(255,255,255,0.7); font-size: 0.82rem; font-style: italic;
  }

  /* FULL BLEED IMAGE BREAK */
  .image-break {
    width: 100%; aspect-ratio: 21/7; overflow: hidden; position: relative;
  }
  .image-break img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; }
  .image-break-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(11,13,25,0.92) 0%, rgba(11,13,25,0.75) 60%, rgba(11,13,25,0.3) 100%);
    display: flex; align-items: center; padding: 3rem 4rem;
  }
  .image-break-quote {
    max-width: 780px;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem); font-weight: 700; color: #fff; line-height: 1.4; text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .image-break-quote em { color: #00c2b5; font-style: normal; }

  /* HOW WE WORK STEPS */
  .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem; }
  @media (max-width: 800px) { .steps-grid { grid-template-columns: 1fr; } }
  .step-card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    padding: 2rem 1.8rem;
    position: relative;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .step-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.08); transform: translateY(-3px); }
  .step-num {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: #00c2b5; margin-bottom: 0.8rem;
  }
  .step-card h3 { font-size: 1.1rem; font-weight: 700; color: #0b0d19; margin-bottom: 0.6rem; }
  .step-card p { font-size: 0.9rem; color: #555; line-height: 1.75; }
  .step-connector {
    display: none;
  }

  /* SERVICES */
  .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem; }
  @media (max-width: 900px) { .services-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 580px) { .services-grid { grid-template-columns: 1fr; } }
  .service-card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    border-top: 4px solid #00c2b5;
    padding: 2rem 1.8rem;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .service-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.08); transform: translateY(-3px); }
  .service-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(0,194,181,0.1); display: flex; align-items: center; justify-content: center; margin-bottom: 1.2rem; }
  .service-icon svg { color: #00c2b5; }
  .service-card h3 { font-size: 1.05rem; font-weight: 700; color: #0b0d19; margin-bottom: 0.6rem; }
  .service-card p { font-size: 0.88rem; color: #555; line-height: 1.75; }
  .service-bullets { list-style: none; margin-top: 1rem; display: flex; flex-direction: column; gap: 0.4rem; }
